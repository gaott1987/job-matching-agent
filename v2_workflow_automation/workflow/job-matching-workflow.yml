    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: deepseek-v4-pro
          provider: langgenius/tongyi/tongyi
        model_selector: null
        prompt_template:
        - id: cd213a59-def4-4e84-b557-c41782204c43
          role: system
          text: '你是一名具备广泛行业背景的资深猎头与职业规划专家。你的专长是在不同行业、不同岗位类型中，准确评估候选人与目标职位的匹配度，并给出务实的求职建议。你必须严格按照以下步骤完成评估，不要跳步。


            ## 输入信息


            ### JD 结构化信息

            - 岗位名称：{{#1791368879115.structured_output.job_title#}}

            - 招聘单位：{{#1791368879115.structured_output.company_name#}}

            - 公司描述：{{#1791368879115.structured_output.company_description#}}

            - 薪资范围：{{#1791368879115.structured_output.salary_range#}}

            - 行业背景：{{#1791368879115.structured_output.industry#}}

            - 工作地点：{{#1791368879115.structured_output.location#}}

            - 岗位职责：{{#1791368879115.structured_output.responsibilities#}}

            - 任职要求：{{#1791368879115.structured_output.qualification#}}

            - JD语言：{{#1791368879115.structured_output.language#}}


            ### 岗位池

            {{#1791986871969.text#}}


            ### 候选人全量档案

            {{#1791986832370.text#}}


            ## 执行逻辑（请在内心严格推演，不要跳过）


            ### 第一步：概括岗位画像与行业定位


            1. 概括这个岗位到底需要什么样的人。

            2. 概括这个岗位所属行业的特征。


            ### 第二步：匹配岗位池并确定权重


            1. **提取企业类型**：阅读岗位池，从岗位池的标题中提取企业类型（如：外企大厂、日资外企、国内科技大厂、AI 独角兽）。必须严格使用岗位池里的词汇，绝不能自己发明新词。可以在括号标注与实际JD岗位的差异。

            2. **提取岗位类型**：从岗位池的分类中选取最匹配的岗位类型（如：AI 解决方案架构师）。不要直接照抄 JD 的原始岗位名称，必须映射到岗位池里的标准分类，但可以在括号内标注与JD原始岗位的差异。

            3. **判断优先级**：根据岗位池信息判断投递优先级（第一、第二、第三、不投）。

            4. **读取权重**：从岗位池中提取该岗位类型对应的各个评分维度的百分比权重。

            *如果该 JD 与岗位池中的所有分类差异极大，请将优先级标记为 “不投”，并跳至输出。*


            ### 第三步：匹配度打分计算


            1. 分析档案与 JD，确认是否满足硬门槛。如果不满足，总分最高不得超过 50 分。

            2. 结合权重与候选人档案，评估6个评分维度（准入匹配、硬技能、业务经验、职责层级、软技能、叙事匹配）的表现，给出每个维度的分数（0-5分）。

            3. 根据提取的该岗位类型评分权重算出最终得分（0-100分）。

            4. 给出建议：≥80 强烈推荐，60-79 推荐，40-59 谨慎，<40 不建议。（注意：硬门槛不满足或 “不投” 时，最高只能给 “谨慎”
            或 “不建议”）。


            ### 第四步：深度简历建议（若建议不是 “不建议”）


            必须深挖档案，针对 JD 给出以下四个维度的实操建议：


            1. **简历总体概述**：基于第一步的画像，简历主线叙事应该怎么写？

            2. **必须体现的能力及证据**：JD 要求什么？档案里哪句话能证明？必须严格引用档案原话或事实。

            3. **加分项信息**：档案里有哪些能证明学习能力、跨域能力的 “闪光点” 可以放进简历？

            4. **挖掘潜力项**：针对 JD 的要求，候选人目前缺什么？怎么用过往经历去 “包装” 和挖掘？


            ### 语言规则


            如果 JD 是英文，简历方向建议用英文，分析说明用中文；如果 JD 是中文，全部用中文。


            ## 输出要求

            请严格根据 Dify 的结构化输出 Schema 输出 JSON。

            - `job_title` 和 `company_name` 必须使用 JD 原文，不要修改。

            - `dimension_scores` 请根据岗位池的权重，输出5个维度的名称和打分。

            - `must_include` 输出最多5项。

            - `bonus_items` 输出最多3项。

            - `potential_to_dig` 输出最多2项。'
        selected: false
        structured_output:
          schema:
            properties:
              bonus_items:
                description: 加分项信息，不超过3项
                items:
                  type: string
                type: array
              company_name:
                description: JD中企业名称或者描述，完整原文，不要修改或者编造
                type: string
              company_type:
                description: 填写岗位池中的企业类型
                type: string
              dimension_scores:
                description: 各个维度的具体评分
                items:
                  properties:
                    name:
                      description: 维度名称，如：硬技能、经验、职责等
                      type: string
                    score:
                      description: 该维度的得分，1-5分
                      type: number
                  required:
                  - name
                  - score
                  type: object
                type: array
              hard_threshold_note:
                description: 说明学历、年限等硬门槛是否满足
                type: string
              job_title:
                description: JD中岗位名称，完整原文名称，不要修改或者编造
                type: string
              must_include:
                description: 必须体现的能力及档案证据，不超过5项
                items:
                  properties:
                    capability:
                      description: JD要求的具体能力
                      type: string
                    evidence:
                      description: 档案原话或事实
                      type: string
                  required:
                  - capability
                  - evidence
                  type: object
                type: array
              overall_score:
                description: 总体匹配度，0-100分
                type: number
              position_profile:
                description: 概括岗位需要什么人及行业特征
                type: string
              potential_to_dig:
                description: 需挖掘的潜力项，不超过2项
                items:
                  properties:
                    missing:
                      description: JD要求但档案没有的缺失项
                      type: string
                    suggestion:
                      description: 如何用过往经历包装和挖掘的建议
                      type: string
                  required:
                  - missing
                  - suggestion
                  type: object
                type: array
              priority:
                description: 该岗位的优先级
                enum:
                - 第一
                - 第二
                - 第三
                - 不投
                type: string
              reasons:
                description: 核心建议原因，至少1条，不超过5条
                items:
                  type: string
                type: array
              recommendation:
                description: 投递建议
                enum:
                - 强烈推荐
                - 推荐
                - 谨慎
                - 不建议
                type: string
              resume_summary:
                description: 基于岗位画像，简历主线叙事应该怎么写
                type: string
              role_type:
                description: 填写岗位池中的岗位类型
                type: string
            required:
            - job_title
            - company_name
            - company_type
            - role_type
            - priority
            - position_profile
            - overall_score
            - dimension_scores
            - recommendation
            - hard_threshold_note
            - reasons
            - resume_summary
            - must_include
            - bonus_items
            - potential_to_dig
            type: object
